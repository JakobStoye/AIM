[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aim519"
version = "1.0.0"
description = "Exact algebraic verification of Euclidean mechanical Lie brackets"
requires-python = ">=3.11"
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"numerical_case/*.py" = ["E402"]
